name: App foundation
on:
  pull_request:
    paths: ['app/**', 'supabase/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'supabase/**', '.github/workflows/app.yml']
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npm run export
        env:
          CI: '1'
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '2.118.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: supabase start --workdir .
      - run: supabase db lint --local --fail-on warning --workdir .
      - run: supabase test db --workdir .
      - run: python3 supabase/tests/schedule_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/template_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/program_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/booking_status_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/booking_plan_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/booking_reschedule_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/booking_request_resolution_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/attendance_credit_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/onboarding_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/invitation_concurrency.py --container supabase_db_trainerApp
      - run: python3 supabase/tests/auth_email_smoke.py --workdir . --container supabase_db_trainerApp
      - run: npm run db:types:check
        working-directory: app
      - if: always()
        run: supabase stop --workdir .
