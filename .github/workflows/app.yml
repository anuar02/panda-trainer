name: App foundation
on:
  pull_request:
    paths: ['app/**', 'supabase/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'supabase/**', '.github/workflows/app.yml']
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npm run export
        env:
          CI: '1'
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db -- start
      - run: npm run db -- db lint --local --fail-on warning
      - run: npm run db -- test db
      - if: always()
        run: npm run db -- stop
