<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Board</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --line: #e4e3df; --text: #1b1b1a; --muted: #6d6c67;
    --run: #2563eb; --run-bg: #e8effd; --ok: #15803d; --ok-bg: #e5f4ea; --review: #a16207; --review-bg: #fbf1d9;
    --fail: #b91c1c; --fail-bg: #fbe7e7; --idle: #6d6c67; --idle-bg: #eeede9; --accent: #c2410c;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --panel: #1b1b1a; --line: #2c2c2a; --text: #ecebe7; --muted: #9b9a94;
      --run: #7aa2ff; --run-bg: #1c2742; --ok: #5fd08a; --ok-bg: #16301f; --review: #f2c14e; --review-bg: #3a2f12;
      --fail: #ff7b7b; --fail-bg: #3b1818; --idle: #9b9a94; --idle-bg: #262624; --accent: #ff8a4c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 24px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .meta b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .progress { flex: 1 1 220px; min-width: 200px; }
  .bar { height: 6px; background: var(--idle-bg); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .banner { background: var(--review-bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; white-space: pre-wrap; }
  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-height: 118px; }
  .lane .who { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .lane .what { font-weight: 600; margin-bottom: 6px; }
  .lane .note { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .s-running { color: var(--run); background: var(--run-bg); }
  .s-merged, .s-ok { color: var(--ok); background: var(--ok-bg); }
  .s-review { color: var(--review); background: var(--review-bg); }
  .s-failed, .s-fail, .s-interrupted { color: var(--fail); background: var(--fail-bg); }
  .s-queued, .s-closed, .s-idle { color: var(--idle); background: var(--idle-bg); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.task { cursor: pointer; }
  tr.task:hover td { background: color-mix(in srgb, var(--idle-bg) 50%, transparent); }
  tr.detail td { background: var(--bg); }
  tr:last-child td { border-bottom: 0; }
  .name { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); }
  a { color: var(--run); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
  .row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .top { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .empty { color: var(--muted); padding: 14px 0; }
  .hide-sm { }
  @media (max-width: 760px) {
    .cols { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
    th, td { padding: 9px 8px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Agent Board</h1>
    <div class="meta" id="meta"></div>
    <div class="progress" id="progress"></div>
  </header>
  <div id="stop"></div>

  <h2>Now</h2>
  <div class="lanes" id="lanes"></div>

  <h2>Tasks</h2>
  <table>
    <thead><tr><th>Task</th><th>Status</th><th class="hide-sm">Account</th><th class="hide-sm">Time</th><th>PR</th><th class="hide-sm">Tokens</th></tr></thead>
    <tbody id="tasks"></tbody>
  </table>

  <div class="cols">
    <div>
      <h2>Merged into <span id="base"></span></h2>
      <div class="card" id="merged"></div>
    </div>
    <div>
      <h2>Coordinator runs</h2>
      <div class="card" id="coord"></div>
    </div>
  </div>

  <h2>Coordinator log</h2>
  <div class="card"><pre id="clog" class="row"></pre></div>

  <h2>Supervisor</h2>
  <div class="card"><pre id="slog" class="row"></pre></div>
</main>
<script>
const LABELS = { running: "Running", review: "Awaiting merge", queued: "Queued", failed: "Failed",
  interrupted: "Interrupted", merged: "Merged", closed: "Closed", ok: "Done", fail: "Failed", idle: "Idle" };
const ACCOUNTS = ["work", "personal", "third"];
const open = new Set();
let data = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chip = s => `<span class="chip s-${s}">${LABELS[s] || s}</span>`;
const dur = s => { if (s == null) return "—"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`; };
const ago = t => dur(Date.now() / 1000 - t) + " ago";
const prLink = n => n ? `<a href="${data.repo}/pull/${n}" target="_blank" rel="noopener">#${n}</a>` : "—";

function render() {
  const d = data;
  document.getElementById("meta").innerHTML =
    `<span><span class="dot" style="background:${d.supervisor ? "var(--ok)" : "var(--fail)"}"></span>Supervisor <b>${d.supervisor ? "running" : "stopped"}</b></span>` +
    `<span>Base <b>${esc(d.base)}</b></span><span>Updated ${new Date(d.now * 1000).toLocaleTimeString()}</span>`;
  const pct = Math.min(100, d.done / d.max * 100);
  document.getElementById("progress").innerHTML =
    (d.max >= 1000 ? `<div class="meta"><span><b>${d.done}</b> tasks finished · no limit</span></div>` : `<div class="meta"><span><b>${d.done}</b> of ${d.max} tasks finished</span></div><div class="bar"><i style="width:${pct}%"></i></div>`);
  document.getElementById("stop").innerHTML = d.stop ? `<div class="banner"><b>Stopped by coordinator.</b>\n${esc(d.stop)}</div>` : "";
  document.getElementById("base").textContent = d.base;

  const lanes = ACCOUNTS.map(acc => {
    const t = d.tasks.find(x => x.account === acc && x.state === "running");
    const next = d.tasks.filter(x => x.account === acc && x.state === "queued").length;
    const meta = t && t.container ? `${esc(t.container.mem || "")}${t.container.cpu ? " · " + esc(t.container.cpu) : ""}` : "";
    return `<div class="lane"><div class="who"><span>${acc}${acc === "third" ? " · Pro" : ""}</span><span>${meta}</span></div>` +
      (t ? `<div class="what">${esc(t.title)}</div>${chip("running")} <span class="num" style="color:var(--muted)">${dur(t.duration)}</span>
             <div class="note" style="margin-top:8px">${esc(t.text)}</div>`
         : `<div class="what">Idle</div>${chip("idle")} <span style="color:var(--muted)">${next ? next + " queued"
             : d.coordinator[0] && d.coordinator[0].state === "running" ? "waiting for coordinator"
             : "no unblocked tasks — see coordinator log"}</span>`) + `</div>`;
  });
  const c = d.coordinator[0];
  lanes.push(`<div class="lane"><div class="who"><span>coordinator · third</span><span>${c ? ago(c.started) : ""}</span></div>` +
    (c ? `<div class="what">${c.state === "running" ? "Reviewing and planning" : "Last run"}</div>${chip(c.state)} <span class="num" style="color:var(--muted)">${dur(c.duration)}</span>
           <div class="note" style="margin-top:8px">${esc(c.text)}</div>` : `<div class="what">Not started</div>`) + `</div>`);
  document.getElementById("lanes").innerHTML = lanes.join("");

  document.getElementById("tasks").innerHTML = d.tasks.map(t => {
    const row = `<tr class="task" data-name="${esc(t.name)}"><td><div>${esc(t.title)}</div><div class="name">${esc(t.name)}</div></td>
      <td>${chip(t.state)}</td><td class="hide-sm">${esc(t.account)}</td><td class="num hide-sm">${dur(t.duration)}</td>
      <td>${prLink(t.pr)}</td><td class="num hide-sm">${esc(t.tokens || "—")}</td></tr>`;
    return row + (open.has(t.name) ? `<tr class="detail"><td colspan="6"><pre>${esc(t.text || "No output yet.")}</pre></td></tr>` : "");
  }).join("") || `<tr><td colspan="6" class="empty">No tasks yet.</td></tr>`;

  document.getElementById("merged").innerHTML = d.merged.map(m =>
    `<div class="row"><div class="top"><span>${esc(m.subject.replace(/\s*\(#\d+\)\s*$/, ""))}</span><span class="num" style="color:var(--muted)">${ago(m.time)}</span></div>
     <div class="name">${esc(m.sha)} ${m.pr ? "· " + prLink(m.pr) : ""}</div></div>`).join("") || `<div class="empty">Nothing yet.</div>`;

  document.getElementById("coord").innerHTML = d.coordinator.map(r =>
    `<div class="row"><div class="top"><span>${chip(r.state)} <span class="num" style="color:var(--muted)">${dur(r.duration)}${r.tokens ? " · " + esc(r.tokens) + " tokens" : ""}</span></span>
     <span class="num" style="color:var(--muted)">${ago(r.started)}</span></div>
     ${r.text ? `<details><summary>Summary</summary><pre>${esc(r.text)}</pre></details>` : ""}</div>`).join("") || `<div class="empty">No runs yet.</div>`;

  document.getElementById("clog").textContent = d.coordinator_log || "The coordinator has not written its log yet.";
  document.getElementById("slog").textContent = d.supervisor_log.join("\n");
}

document.getElementById("tasks").addEventListener("click", e => {
  const tr = e.target.closest("tr.task");
  if (!tr || e.target.closest("a")) return;
  const n = tr.dataset.name;
  open.has(n) ? open.delete(n) : open.add(n);
  render();
});

async function load() {
  try {
    data = await (await fetch("/api/status", { cache: "no-store" })).json();
    render();
  } catch (err) {
    document.getElementById("meta").textContent = "Dashboard server unreachable — is server.py running?";
  }
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
