<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Красная панда — в движении</title>
  <link rel="stylesheet" href="viewer.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
  <main class="studio">
    <section class="intro">
      <a class="back" href="../CLAUDE-RED-PANDA-HANDOFF.md">trainerApp / маскот</a>
      <h1>Теперь<br>в движении.</h1>
      <p class="lead">Та самая красная панда.<br>С характером и тёмной повязкой.</p>
      <figure class="reference"><img src="reference/a-pose-v1.png" alt="Референс красной панды в A-позе"><figcaption>От рисунка<br>к объёму</figcaption></figure>
      <p class="aside">Поворачивайте панду, приближайте и пробуйте движения. Всё можно рассмотреть со всех сторон.</p>
      <a class="notes" href="README.md">Об эксперименте и файлах</a>
    </section>
    <section class="phone" aria-label="Интерактивная 3D-панда">
      <header class="phone-header"><span>Твой напарник</span><span class="status-dot" title="3D-модель"></span></header>
      <div id="stage" class="stage"><div id="loading" role="status">Загружаю панду…</div></div>
      <div class="stage-tools"><button id="reset-view" aria-label="Вернуть вид спереди">Спереди</button><button id="rotate" aria-pressed="false">Вращать</button></div>
      <div class="controls">
        <div class="mood-line"><h2 id="mood-title">Привет, я рядом.</h2><button id="pause" class="pause" aria-label="Приостановить движение" aria-pressed="false">Ⅱ</button></div>
        <p id="mood-description">Выберите движение</p>
        <div id="actions" class="actions" aria-label="Движения панды"></div>
        <label class="speed">Темп <input id="speed" aria-label="Скорость движения" type="range" min="0.5" max="1.5" value="1" step="0.05"><output id="speed-value">1×</output></label>
      </div>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
