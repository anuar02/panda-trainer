<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Проверка ширины исследования</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;color:#050505;background:#eeeef0}header{padding:18px 24px;background:white;display:flex;align-items:center;gap:16px;flex-wrap:wrap}a{color:inherit}label{display:flex;align-items:center;gap:10px}select{min-height:44px;font:inherit;border:1px solid #b9b9bf;border-radius:10px;padding:8px;background:white}main{overflow:auto;padding:24px;min-height:calc(100dvh - 100px)}iframe{display:block;width:375px;height:800px;border:1px solid #b9b9bf;background:white;margin:0 auto;max-width:none}p{margin:0;color:#5e5f60;font-size:12px}select:focus-visible,a:focus-visible{outline:3px solid #050505;outline-offset:3px}
</style></head><body><header><a href="direction.html">Вернуться к исследованию</a><label>Ширина <select id="width"><option>320</option><option selected>375</option><option>390</option><option>768</option><option>1024</option><option>1280</option></select> px</label><label>Раздел <select id="section"><option value="screens">Экраны</option><option value="illustrations">Иллюстрации</option><option value="motion">Движение</option><option value="routes">Направления</option></select></label><p>Реальная ширина iframe, без масштабирования. Это ручной просмотр, не эмуляция телефона.</p></header><main><iframe id="preview" title="Исследование в выбранной ширине" src="direction.html#screens"></iframe></main><script>
const preview=document.querySelector('#preview');
document.querySelector('#width').addEventListener('change',event=>{preview.style.width=event.target.value+'px';});
document.querySelector('#section').addEventListener('change',event=>{preview.src='direction.html#'+event.target.value;});
</script></body></html>
