  - complementary [ref=e311]:
    - generic [ref=e312]: Экран
    - heading "Сегодня" [level=2] [ref=e313]
    - paragraph [ref=e314]: "Одна хронологическая повестка отвечает на «что дальше»: дата и текущее время, единый список занятий, ближайшее раскрыто. Без отдельной hero-карточки и без финансовых виджетов."
    - generic [ref=e316]: Правила
    - list [ref=e317]:
      - listitem [ref=e318]: Демо-время зафиксировано (DB.NOW_TIME, ?now=HH:MM). Реальные часы не используются.
      - listitem [ref=e319]: Временная подсказка («Через N мин», «Идёт сейчас») не заменяет статус договорённости.
      - listitem [ref=e320]: Запросы, требующие ответа тренера, показаны счётчиком в шапке и действием внутри своей записи.
      - listitem [ref=e321]: Пересечения — отдельные записи со спокойной связкой; это не мини-группа.
      - listitem [ref=e322]: Свободные окна считаются по объединению занятых интервалов; нажатие открывает форму нового занятия с этим временем, но не создаёт запись.
      - listitem [ref=e323]: Мини-группа — одна сессия с участниками; отмена участника не отменяет группу.
    - generic [ref=e325]: Проверка сценариев
